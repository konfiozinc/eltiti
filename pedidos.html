<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B22222">
<title>Pedidos · EL TITI</title>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<!-- Alpine.js -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<style>
:root{
  --accent:#B22222; --accent2:#E74C3C; --bg:#F4F6F8; --card:#FFFFFF;
  --txt:#1A202C; --muted:#6B7280; --line:#E2E8F0; --ok:#16A34A; --warn:#D97706;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
[x-cloak]{display:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:30px 24px;box-shadow:0 20px 50px rgba(0,0,0,.10)}
.login-logo{width:72px;height:72px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 16px}
.login-card h1{text-align:center;font-size:1.3rem;margin-bottom:4px}
.login-card .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.field input:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;font-weight:700;font-size:.95rem;padding:13px 18px;transition:.18s}
.btn-block{width:100%}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.error-msg{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:14px}

/* ===== PANEL ===== */
.app-head{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.app-head .t{font-weight:900;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.app-head .t .dot{width:9px;height:9px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.3)}
.app-head button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:.8rem;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:16px}

/* Contadores por estado */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.counter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.counter .n{font-size:1.5rem;font-weight:900;line-height:1.1}
.counter .l{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;margin-bottom:14px}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:.8rem;font-weight:600;color:var(--muted)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Lista de pedidos */
.list{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.pcard-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pnum{font-weight:900;font-size:1rem}
.pcod{font-size:.72rem;color:var(--muted);font-weight:600}
.badge{font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.pcliente{font-size:.85rem;margin-bottom:6px}
.pcliente b{font-size:.88rem}
.pitems{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:.85rem}
.pitems .it{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.pitems .it .q{color:var(--muted);font-size:.78rem}
.pfoot{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.pmeta{font-size:.72rem;color:var(--muted);margin-top:4px}
.pactions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:.8rem;font-weight:700}
.pbtn.advance{background:var(--accent);border-color:var(--accent);color:#fff}
.pbtn.danger{color:#DC2626;border-color:#FECACA}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:40px 20px;background:var(--card);border-radius:16px;border:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:.85rem;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.3);pointer-events:none}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div x-data="admin" x-init="init()" class="login-wrap" x-show="authReady && !usuario" x-cloak>
  <div class="login-card">
    <div class="login-logo">🍔</div>
    <h1>Panel de Pedidos</h1>
    <div class="sub">EL TITI · Comidas Rápidas</div>
    <div class="error-msg" x-show="loginError" x-text="loginError"></div>
    <div class="field"><label>Correo</label><input type="email" x-model="email" placeholder="tu@correo.com" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input type="password" x-model="password" placeholder="••••••••" autocomplete="current-password" @keydown.enter="login()"></div>
    <button class="btn btn-primary btn-block" @click="login()" :disabled="loginLoading" x-text="loginLoading ? 'Entrando…' : 'Entrar'"></button>
  </div>
</div>

<!-- ===== PANEL ===== -->
<div x-data="admin" x-init="init()" x-show="usuario" x-cloak>
  <div class="app-head">
    <div class="t"><span class="dot"></span> Pedidos · EL TITI</div>
    <button @click="logout()">Cerrar sesión</button>
  </div>
  <div class="wrap">
    <!-- Contadores -->
    <div class="counters">
      <div class="counter"><div class="n" x-text="contadores.todos"></div><div class="l">Todos</div></div>
      <div class="counter" style="border-color:#2563EB;"><div class="n" style="color:#2563EB;" x-text="contadores.recibido"></div><div class="l">Recibido</div></div>
      <div class="counter" style="border-color:#D97706;"><div class="n" style="color:#D97706;" x-text="contadores.preparando"></div><div class="l">Preparando</div></div>
      <div class="counter" style="border-color:#7C3AED;"><div class="n" style="color:#7C3AED;" x-text="contadores.en_camino"></div><div class="l">En camino</div></div>
      <div class="counter" style="border-color:#16A34A;"><div class="n" style="color:#16A34A;" x-text="contadores.entregado"></div><div class="l">Entregado</div></div>
      <div class="counter" style="border-color:#DC2626;"><div class="n" style="color:#DC2626;" x-text="contadores.cancelado"></div><div class="l">Cancelado</div></div>
    </div>

    <!-- Filtros -->
    <div class="chips">
      <template x-for="f in filtros" :key="f.key">
        <button class="chip" :class="filtro === f.key ? 'active' : ''" @click="filtro = f.key" x-text="f.label"></button>
      </template>
    </div>

    <!-- Lista -->
    <div class="list" x-show="!cargando">
      <div class="empty" x-show="!filtrados.length">No hay pedidos en este estado.</div>
      <template x-for="p in filtrados" :key="p.id">
        <div class="pcard">
          <div class="pcard-top">
            <div>
              <span class="pnum" x-text="p.numeroPedido || 'PEDIDO'"></span>
              <div class="pcod" x-text="'Consulta: ' + (p.codigoConsulta || '—')"></div>
            </div>
            <span class="badge" :style="'background:' + estadoColor[p.estado]" x-text="estadoLabel[p.estado]"></span>
          </div>
          <div class="pcliente">
            <b x-text="p.cliente.nombre"></b> · <span x-text="p.cliente.telefono"></span><br>
            <span style="color:var(--muted)">📍 <span x-text="p.cliente.direccion"></span> · 💳 <span x-text="p.cliente.metodoPago"></span></span>
            <div x-show="p.cliente.notas" style="color:var(--muted);font-size:.82rem;margin-top:2px;">📝 <span x-text="p.cliente.notas"></span></div>
          </div>
          <div class="pitems">
            <template x-for="it in p.items" :key="it.productoId">
              <div class="it">
                <span><span class="q" x-text="it.cantidad + '× '"></span><span x-text="it.nombre"></span></span>
                <span x-text="'$' + (it.precio * it.cantidad).toLocaleString('es-CO')"></span>
              </div>
            </template>
          </div>
          <div class="pfoot">
            <span>TOTAL</span>
            <span x-text="'$' + Number(p.total).toLocaleString('es-CO')"></span>
          </div>
          <div class="pmeta" x-text="'Recibido: ' + fmtHora(p.fechaCreacion)"></div>
          <div class="pactions" x-show="p.estado !== 'entregado' && p.estado !== 'cancelado'">
            <button class="pbtn advance" @click="cambiarEstado(p)" x-text="siguienteLabel[p.estado]"></button>
            <button class="pbtn danger" @click="cancelarPedido(p)">Cancelar</button>
          </div>
        </div>
      </template>
    </div>

    <div class="empty" x-show="cargando">Cargando pedidos…</div>
  </div>
</div>

<div class="toast" x-show="toast" x-text="toast" x-cloak></div>

<script src="admin-config.js"></script>
<script>
// ⚠️ Instancias de Firebase FUERA del estado reactivo de Alpine
// (Alpine envuelve en Proxy y rompe los métodos internos de Firebase).
let firebaseAuth = null;
let firebaseDB = null;

function initFirebase(){
  if (firebase.apps.length === 0) firebase.initializeApp(window.ADMIN_CONFIG.firebase);
  firebaseAuth = firebase.auth();
  firebaseDB = firebase.database();
}

function admin(){
  return {
    cfg: window.ADMIN_CONFIG,
    usuario: null, authReady: false,
    email: '', password: '', loginError: '', loginLoading: false,
    pedidos: [], filtro: 'todos', cargando: true, toast: '',
    filtros: [
      { key:'todos', label:'Todos' },
      { key:'recibido', label:'Recibido' },
      { key:'preparando', label:'Preparando' },
      { key:'en_camino', label:'En camino' },
      { key:'entregado', label:'Entregado' },
      { key:'cancelado', label:'Cancelado' }
    ],
    estadoLabel: { recibido:'Recibido', preparando:'Preparando', en_camino:'En camino', entregado:'Entregado', cancelado:'Cancelado' },
    estadoColor: { recibido:'#2563EB', preparando:'#D97706', en_camino:'#7C3AED', entregado:'#16A34A', cancelado:'#DC2626' },
    siguiente: { recibido:'preparando', preparando:'en_camino', en_camino:'entregado' },
    siguienteLabel: { recibido:'Preparar', preparando:'En camino', en_camino:'Entregar' },

    init(){
      initFirebase();
      firebaseAuth.onAuthStateChanged(u => {
        this.usuario = u;
        this.authReady = true;
        if (u) this.escuchar();
      });
    },

    escuchar(){
      firebaseDB.ref(this.cfg.ruta + '/pedidos').on('value', snap => {
        const data = snap.val() || {};
        const lista = Object.keys(data).filter(k => data[k]).map(k => ({ id: k, ...data[k] }));
        lista.sort((a, b) => (b.fechaCreacion || 0) - (a.fechaCreacion || 0));
        this.pedidos = JSON.parse(JSON.stringify(lista));
        this.cargando = false;
      }, err => { this.cargando = false; this.toastMsg('Error al cargar: ' + err.message); });
    },

    get contadores(){
      const c = { todos:this.pedidos.length, recibido:0, preparando:0, en_camino:0, entregado:0, cancelado:0 };
      this.pedidos.forEach(p => { if (c[p.estado] !== undefined) c[p.estado]++; });
      return c;
    },

    get filtrados(){
      if (!this.filtro || this.filtro === 'todos') return this.pedidos;
      return this.pedidos.filter(p => p.estado === this.filtro);
    },

    fmtHora(ts){
      if (!ts) return '—';
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '—';
      return d.toLocaleString('es-CO', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    },

    cambiarEstado(p){
      const sig = this.siguiente[p.estado];
      if (!sig) return;
      firebaseDB.ref(this.cfg.ruta + '/pedidos/' + p.id).update({ estado: sig, fechaActualizacion: firebase.database.ServerValue.TIMESTAMP })
        .catch(e => this.toastMsg('Error: ' + e.message));
    },

    cancelarPedido(p){
      if (!confirm('¿Cancelar el pedido ' + (p.numeroPedido || '') + '?')) return;
      firebaseDB.ref(this.cfg.ruta + '/pedidos/' + p.id).update({ estado: 'cancelado', fechaActualizacion: firebase.database.ServerValue.TIMESTAMP })
        .catch(e => this.toastMsg('Error: ' + e.message));
    },

    login(){
      this.loginError = '';
      if (!this.email.trim() || !this.password) { this.loginError = 'Ingresa correo y contraseña.'; return; }
      this.loginLoading = true;
      firebaseAuth.signInWithEmailAndPassword(this.email.trim(), this.password)
        .then(() => { this.password = ''; })
        .catch(e => { this.loginError = 'No se pudo entrar: ' + (e.code === 'auth/invalid-credential' ? 'correo o contraseña incorrectos' : e.message); })
        .finally(() => this.loginLoading = false);
    },

    logout(){ firebaseAuth.signOut(); this.pedidos = []; },

    toastMsg(msg){
      this.toast = msg;
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => this.toast = '', 2500);
    }
  };
}
</script>
</body>
</html>
